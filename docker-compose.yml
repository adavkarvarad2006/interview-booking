services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/interview_counselling_db
      - JWT_SECRET=change_this_to_a_secure_random_string_in_production
      - CLIENT_URL=http://localhost:5000
      - CALENDLY_API_KEY=${CALENDLY_API_KEY:-}
      - CALENDLY_WEBHOOK_SIGNING_KEY=${CALENDLY_WEBHOOK_SIGNING_KEY:-}
      - CALENDLY_15_MIN_URL=${CALENDLY_15_MIN_URL:-https://calendly.com/interview-counsellor/15-min-interview-counselling}
      - CALENDLY_30_MIN_URL=${CALENDLY_30_MIN_URL:-https://calendly.com/interview-counsellor/30-min-mock-interview-training}
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
